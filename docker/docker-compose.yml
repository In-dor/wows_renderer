services:
  wows-renderer:
    container_name: wows-renderer-service
    image: wows-renderer-service:latest
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:8000"
    environment:
      TZ: Asia/Shanghai
      MAX_CONCURRENT_RENDERS: ${MAX_CONCURRENT_RENDERS:-2}
      RENDER_TIMEOUT: ${RENDER_TIMEOUT:-600}
      MAX_REPLAY_SIZE_MB: ${MAX_REPLAY_SIZE_MB:-100}
      RENDERER_API_TOKEN: ${RENDERER_API_TOKEN:-}
      VAAPI_DEVICE: ${VAAPI_DEVICE:-/dev/dri/renderD128}
    devices:
      - ${VAAPI_DEVICE:-/dev/dri/renderD128}:${VAAPI_DEVICE:-/dev/dri/renderD128}
    group_add:
      # 使用宿主机 `getent group render | cut -d: -f3` 获取，当前 NAS 为 105。
      - "${RENDER_GROUP_ID:-105}"
