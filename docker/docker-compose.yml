services:
  wows-renderer:
    container_name: wows-renderer-service
    image: wows-renderer-service:latest
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:8000"
    environment:
      TZ: Asia/Shanghai
      MAX_CONCURRENT_RENDERS: ${MAX_CONCURRENT_RENDERS:-2}
      RENDER_TIMEOUT: ${RENDER_TIMEOUT:-600}
      MAX_REPLAY_SIZE_MB: ${MAX_REPLAY_SIZE_MB:-100}
      RENDERER_API_TOKEN: ${RENDERER_API_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
